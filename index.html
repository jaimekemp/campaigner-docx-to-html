<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Campaigner Email Body Converter</title>

  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      max-width: 860px;
      margin: 0 auto;
      color: #1e293b;
      background: #f8fafc;
    }
    h2 { 
      margin-top: 0; 
      color: #0f172a; 
      font-size: 20px;
    }
    
    .drop-zone {
      border: 2px dashed #94a3b8;
      border-radius: 8px;
      padding: 36px 20px;
      text-align: center;
      background: #f1f5f9;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      user-select: none;
    }
    .drop-zone:hover, .drop-zone.dragover { 
      border-color: #CC0633; 
      background: #fef2f2;
    }
    .drop-zone * {
      pointer-events: none;
    }
    .drop-zone svg {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: #64748b;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s;
    }
    .drop-zone:hover svg, .drop-zone.dragover svg { 
      stroke: #CC0633; 
    }
    .drop-zone-text {
      margin: 0;
      font-size: 15px;
      color: #334155;
    }
    .drop-zone-subtext {
      margin: 0;
      font-size: 12px;
      color: #64748b;
    }

    .controls {
      margin-top: 16px;
      display: flex;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.15s;
    }
    .btn-primary {
      background: #CC0633;
      color: #fff;
      padding: 8px 16px;
    }
    .btn-primary:hover { background: #a6192e; }
    .btn-secondary {
      background: #e2e8f0;
      color: #334155;
      padding: 8px 16px;
    }
    .btn-secondary:hover {
      background: #cbd5e1;
      color: #0f172a;
    }
    .btn-quick-copy {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
      padding: 6px 12px;
      font-size: 12px;
      white-space: nowrap;
    }
    .btn-quick-copy:hover {
      background: #e2e8f0;
      color: #0f172a;
      border-color: #94a3b8;
    }

    .metadata-panel {
      margin-top: 18px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .meta-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .meta-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
    }
    .meta-input-group {
      display: flex;
      gap: 8px;
    }
    .meta-input {
      flex: 1;
      padding: 7px 10px;
      font-size: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      background: #f8fafc;
      color: #0f172a;
      outline: none;
    }
    .meta-input:focus {
      border-color: #CC0633;
      background: #ffffff;
    }

    .output-wrapper {
      margin-top: 18px;
    }
    .output-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .output-header {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
    }
    textarea {
      width: 100%;
      height: 480px;
      font-family: Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
      line-height: 1.45;
      background: #ffffff;
      color: #0f172a;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.03);
    }
    textarea:focus {
      outline: 2px solid #CC0633;
      outline-offset: -1px;
      border-color: transparent;
    }
  </style>
</head>
<body>
  <h2>Campaigner Email Body Converter</h2>

  <div class="drop-zone" id="drop-zone">
    <svg viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
      <polyline points="17 8 12 3 7 8" />
      <line x1="12" y1="3" x2="12" y2="15" />
    </svg>
    <p class="drop-zone-text">Drag and drop your <strong>.docx</strong> file here, or click to browse</p>
    <p class="drop-zone-subtext">Automatically extracts metadata, formats buttons, notes, and builds clean Campaigner HTML</p>
  </div>

  <input type="file" id="file-input" accept=".docx" style="display: none;" />

  <div class="controls">
    <button class="btn-secondary" id="reset-btn">Reset All</button>
  </div>

  <div class="metadata-panel">
    <div class="meta-row">
      <label class="meta-label" for="subject-field">Subject Line</label>
      <div class="meta-input-group">
        <input type="text" id="subject-field" class="meta-input" placeholder="Extracted subject line will appear here..." />
        <button class="btn-quick-copy" id="copy-subject-btn">Copy</button>
      </div>
    </div>
    <div class="meta-row">
      <label class="meta-label" for="preheader-field">Preheader</label>
      <div class="meta-input-group">
        <input type="text" id="preheader-field" class="meta-input" placeholder="Extracted preheader will appear here..." />
        <button class="btn-quick-copy" id="copy-preheader-btn">Copy</button>
      </div>
    </div>
  </div>

  <div class="output-wrapper">
    <div class="output-bar">
      <span class="output-header">HTML output</span>
      <button class="btn-primary" id="copy-output-btn">Copy HTML to Clipboard</button>
    </div>
    <textarea id="output" placeholder="HTML output will render here..."></textarea>
  </div>

  <script>
    const fileInput = document.getElementById("file-input");
    const dropZone = document.getElementById("drop-zone");
    const output = document.getElementById("output");
    const subjectField = document.getElementById("subject-field");
    const preheaderField = document.getElementById("preheader-field");

    const resetBtn = document.getElementById("reset-btn");
    const copyOutputBtn = document.getElementById("copy-output-btn");
    const copySubjectBtn = document.getElementById("copy-subject-btn");
    const copyPreheaderBtn = document.getElementById("copy-preheader-btn");

    window.addEventListener("dragover", (e) => e.preventDefault());
    window.addEventListener("drop", (e) => e.preventDefault());

    dropZone.addEventListener("click", () => fileInput.click());

    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.add("dragover");
    });

    dropZone.addEventListener("dragleave", (e) => {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.remove("dragover");
    });

    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.remove("dragover");
      if (e.dataTransfer && e.dataTransfer.files.length > 0) {
        handleFile(e.dataTransfer.files[0]);
      }
    });

    fileInput.addEventListener("change", (e) => {
      if (e.target.files && e.target.files.length > 0) {
        handleFile(e.target.files[0]);
        fileInput.value = "";
      }
    });

    resetBtn.addEventListener("click", () => {
      output.value = "";
      subjectField.value = "";
      preheaderField.value = "";
      fileInput.value = "";
    });

    function triggerCopy(element, button, originalText) {
      if (!element.value) return;
      element.select();
      navigator.clipboard.writeText(element.value);
      button.textContent = "Copied!";
      setTimeout(() => button.textContent = originalText, 1400);
    }

    copyOutputBtn.addEventListener("click", () => triggerCopy(output, copyOutputBtn, "Copy HTML to Clipboard"));
    copySubjectBtn.addEventListener("click", () => triggerCopy(subjectField, copySubjectBtn, "Copy"));
    copyPreheaderBtn.addEventListener("click", () => triggerCopy(preheaderField, copyPreheaderBtn, "Copy"));

    function handleFile(file) {
      if (!file) return;
      if (!file.name.toLowerCase().endsWith(".docx")) {
        alert("Please upload a valid .docx file.");
        return;
      }
      if (typeof mammoth === "undefined") {
        alert("Mammoth library is still loading. Please check internet connection.");
        return;
      }

      const reader = new FileReader();
      reader.onload = function(event) {
        const options = {
          styleMap: [
            "p[style-name='button'] => p.btn-source:fresh",
            "p[style-name='Button'] => p.btn-source:fresh",
            "p[style-name='event block'] => p.event-block:fresh",
            "p[style-name='Event Block'] => p.event-block:fresh",
            "p[style-name='small note'] => p.smallnote:fresh",
            "p[style-name='Small Note'] => p.smallnote:fresh",
            "p[style-name='heading 2'] => h2:fresh",
            "p[style-name='Heading 2'] => h2:fresh",
            "p[style-name='subtitle'] => p.subtitle:fresh",
            "p[style-name='Subtitle'] => p.subtitle:fresh",
            "p[style-name='normal'] => p:fresh",
            "p[style-name='Normal'] => p:fresh",
            "p[style-name='list paragraph'] => p.list-paragraph:fresh",
            "p[style-name='List Paragraph'] => p.list-paragraph:fresh",
            "r[style-name='emphasis'] => em",
            "r[style-name='Emphasis'] => em",
            "r[style-name='strong'] => strong",
            "r[style-name='Strong'] => strong",
            "table[style-name='meta table'] => table.meta-table:fresh",
            "table[style-name='Meta Table'] => table.meta-table:fresh"
          ]
        };

        mammoth.convertToHtml({ arrayBuffer: event.target.result }, options)
          .then(buildCampaignerBody)
          .catch(err => alert("Parsing error: " + err.message));
      };
      reader.readAsArrayBuffer(file);
    }

    function convertBracketLinks(html) {
      if (!html) return "";
      return html.replace(/\[\s*([^|\]]+?)\s*\|\s*([^\]]+?)\s*\]/gi, (match, labelRaw, targetRaw) => {
        if (/^\s*button\s*:/i.test(labelRaw)) return match;

        const cleanLabel = labelRaw.replace(/<[^>]+>/g, "").trim();
        let href = targetRaw.trim();

        const aMatch = targetRaw.match(/href=["']([^"']+)["']/i);
        if (aMatch) {
          href = aMatch[1].trim();
        } else {
          href = targetRaw.replace(/<[^>]+>/g, "").trim();
        }

        if (!href) href = "#";
        return '<a href="' + href + '">' + cleanLabel + '</a>';
      });
    }

    function parseButtonElement(el) {
      const text = el.textContent.trim();
      const isBtnClass = el.classList.contains("btn-source");
      const isBtnTag = /\[\s*button\s*:/i.test(text) || /^button\s*:/i.test(text);

      if (!isBtnClass && !isBtnTag) return null;

      let label = "";
      let href = "https://www.sfu.ca/continuing-studies.html";

      const anchor = el.querySelector("a");
      if (anchor && anchor.getAttribute("href")) {
        href = anchor.getAttribute("href").trim();
        label = anchor.textContent.trim();
      } else if (text.includes("|")) {
        const parts = text.split("|");
        label = parts[0];
        href = parts.slice(1).join("|");
      } else {
        label = text;
      }

      href = href.replace(/<[^>]+>/g, "").replace(/^[\[\s]+|[\]\s]+$/g, "").trim();
      if (!href) href = "https://www.sfu.ca/continuing-studies.html";

      label = label.replace(/<[^>]+>/g, "");
      label = label.replace(/^[\[\s]+|[\]\s]+$/g, "").trim();
      label = label.replace(/^button\s*:\s*/i, "").trim();
      label = label.replace(/^[\[\s]+|[\]\s]+$/g, "").trim();

      if (!label) label = "View details";

      return { label: label, href: href };
    }

    function formatEventBlock(innerHtml) {
      let cleaned = innerHtml
        .replace(/<strong([^>]*)>([\s\S]*?)<br\s*\/?>([\s\S]*?)<\/strong>/gi, "<strong$1>$2</strong><br /><strong$1>$3</strong>")
        .replace(/<strong>\s*<\/strong>/gi, "");

      const lines = cleaned.split(/<br\s*\/?>/i);
      if (!lines.length) return "";

      // First line: ensure <strong> is present
      let line0 = lines[0].trim();
      if (line0.includes("<a ") && !line0.includes("<strong>")) {
        line0 = line0.replace(/(<a[^>]*>)(.*?)(<\/a>)/i, "$1<strong>$2</strong>$3");
      } else if (!line0.startsWith("<strong>") && !line0.startsWith("<a")) {
        line0 = "<strong>" + line0 + "</strong>";
      }
      lines[0] = line0;

      // Lines after the first: strip <strong> from links
      for (let i = 1; i < lines.length; i++) {
        let line = lines[i].trim();
        if (!line) continue;

        line = line.replace(/<strong[^>]*>(<a\b[^>]*>.*?<\/a>)<\/strong>/gi, "$1");
        line = line.replace(/(<a\b[^>]*>)<strong[^>]*>(.*?)<\/strong>(<\/a>)/gi, "$1$2$3");

        lines[i] = line;
      }

      return lines.filter(l => l).join("<br />\n");
    }

    function buildCampaignerBody(result) {
      let rawHtml = result.value
        .replace(/&nbsp;/g, " ")
        .replace(/\u00A0/g, " ");

      const parser = new DOMParser();
      const doc = parser.parseFromString(rawHtml, "text/html");

      let extractedSubject = "";
      let extractedPreheader = "";

      doc.querySelectorAll("table").forEach(table => {
        let isMeta = table.classList.contains("meta-table");
        const rows = Array.from(table.querySelectorAll("tr"));
        
        rows.forEach(row => {
          const cells = Array.from(row.querySelectorAll("td, th"));
          if (cells.length >= 2) {
            const label = cells[0].textContent.replace(/\s+/g, " ").trim().toLowerCase();
            const val = cells[1].textContent.replace(/\s+/g, " ").trim();
            if (label.includes("subject")) {
              extractedSubject = val;
              isMeta = true;
            } else if (label.includes("preheader")) {
              extractedPreheader = val;
              isMeta = true;
            } else if (label.includes("field")) {
              isMeta = true;
            }
          }
        });
        if (isMeta) table.remove();
      });

      const rawElements = Array.from(doc.body.children);
      const cleanNodes = [];
      let customGreeting = "";
      let customSignature = [];

      for (let i = 0; i < rawElements.length; i++) {
        const el = rawElements[i];
        let text = el.textContent.replace(/\s+/g, " ").trim();
        if (!text) continue;

        if (text === "Field Value") continue;

        if (/^subject(\s*line)?:\s*/i.test(text)) {
          if (!extractedSubject) extractedSubject = text.replace(/^subject(\s*line)?:\s*/i, "").trim();
          continue;
        }

        if (/^preheader:\s*/i.test(text)) {
          if (!extractedPreheader) extractedPreheader = text.replace(/^preheader:\s*/i, "").trim();
          continue;
        }

        if (/^(warm|kind|best)\s+(regards|wishes),?\s*$/i.test(text)) {
          customGreeting = text.replace(/,?\s*$/, ",");
          continue;
        }

        if (customGreeting && (text.includes("@sfu.ca") || text.toLowerCase().includes("continuing studies") || text.toLowerCase().includes("firstname"))) {
          customSignature.push(convertBracketLinks(el.innerHTML.replace(/\s+/g, " ").trim()));
          continue;
        }

        cleanNodes.push(el);
      }

      subjectField.value = extractedSubject;
      preheaderField.value = extractedPreheader;

      let bodyHtml = "<p>Hi [Contact.First Name],</p>\n\n";

      for (let i = 0; i < cleanNodes.length; i++) {
        const el = cleanNodes[i];

        // Standard UL list from Mammoth
        if (el.tagName === "UL") {
          const listItems = Array.from(el.querySelectorAll("li"));
          if (listItems.length > 0) {
            bodyHtml += "<ul>\n";
            listItems.forEach(li => {
              bodyHtml += "\t<li>" + convertBracketLinks(li.innerHTML.trim()) + "</li>\n";
            });
            bodyHtml += "</ul>\n\n";
          }
          continue;
        }

        // Word "List Paragraph" style grouping into <ul><li>...</li></ul>
        if (el.classList.contains("list-paragraph")) {
          const listItems = [];
          while (i < cleanNodes.length && cleanNodes[i].classList.contains("list-paragraph")) {
            const itemHtml = convertBracketLinks(cleanNodes[i].innerHTML.trim());
            if (itemHtml) {
              listItems.push(itemHtml);
            }
            i++;
          }
          i--; // Step back one since loop increments

          if (listItems.length > 0) {
            bodyHtml += "<ul>\n";
            listItems.forEach(item => {
              bodyHtml += "\t<li>" + item + "</li>\n";
            });
            bodyHtml += "</ul>\n\n";
          }
          continue;
        }

        let text = el.textContent.replace(/\s+/g, " ").trim();
        let inner = el.innerHTML.replace(/\s+/g, " ").trim();

        if (/^(hi|hello|dear)\s+[^,]+,?\s*$/i.test(text)) continue;

        inner = inner.replace(/(<br\s*\/?>\s*)+$/gi, "").trim();
        if (!inner) continue;

        // Button handler (<a> tag has no class="btn")
        const btnData = parseButtonElement(el);
        if (btnData) {
          bodyHtml += '<p class="btn"><a href="' + btnData.href + '">' + btnData.label + '</a></p>\n\n';
          continue;
        }

        // Heading 2
        if (el.tagName === "H2") {
          const cleanHeading = el.innerHTML.replace(/\s+/g, " ").trim();
          bodyHtml += "<h2>" + cleanHeading + "</h2>\n\n";
          continue;
        }

        // Subtitle followed by paragraph content
        if (el.classList.contains("subtitle") || /^subtitle:?$/i.test(text)) {
          let subtitleTitle = text.replace(/:?\s*$/, "") + ":";
          let followingContent = "";

          if (i + 1 < cleanNodes.length && 
              !cleanNodes[i + 1].classList.contains("subtitle") && 
              !cleanNodes[i + 1].classList.contains("btn-source") && 
              cleanNodes[i + 1].tagName !== "H2" && 
              cleanNodes[i + 1].tagName !== "UL" && 
              !cleanNodes[i + 1].classList.contains("list-paragraph")) {
            i++;
            followingContent = convertBracketLinks(cleanNodes[i].innerHTML.trim()).replace(/(<br\s*\/?>\s*)+$/gi, "");
          }

          if (followingContent) {
            bodyHtml += "<p>\n\t<strong>" + subtitleTitle + "</strong><br />\n\t" + followingContent + "\n</p>\n\n";
          } else {
            bodyHtml += "<p><strong>" + subtitleTitle + "</strong></p>\n\n";
          }
          continue;
        }

        // Small Note
        if (el.classList.contains("smallnote")) {
          let noteInner = convertBracketLinks(inner);
          noteInner = noteInner.replace(/<strong([^>]*)>([\s\S]*?)<br\s*\/?>([\s\S]*?)<\/strong>/gi, "<strong$1>$2</strong><br /><strong$1>$3</strong>");
          noteInner = noteInner.replace(/<strong>\s*<\/strong>/gi, "");
          bodyHtml += '<p class="smallnote">' + noteInner.replace(/<br>/gi, "<br />") + '</p>\n\n';
          continue;
        }

        // Event Block
        if (el.classList.contains("event-block")) {
          const formattedCard = formatEventBlock(convertBracketLinks(inner));
          bodyHtml += "<p>" + formattedCard + "</p>\n\n";
          continue;
        }

        // Standard / Normal Paragraph
        let standardInner = convertBracketLinks(inner);
        standardInner = standardInner.replace(/<strong([^>]*)>([\s\S]*?)<br\s*\/?>([\s\S]*?)<\/strong>/gi, "<strong$1>$2</strong><br /><strong$1>$3</strong>");
        standardInner = standardInner.replace(/<strong>\s*<\/strong>/gi, "");

        bodyHtml += "<p>" + standardInner.replace(/<br>/gi, "<br />") + "</p>\n\n";
      }

      if (customGreeting) {
        bodyHtml += "<p>" + customGreeting + "</p>\n\n";
        bodyHtml += "<p>\n\t" + customSignature.join("<br />\n\t") + "<br />\n</p>\n\n";
      } else {
        bodyHtml += "<p>Kind regards,</p>\n\n";
        bodyHtml += "<p>\n\t<a href=\"https://www.sfu.ca/continuing-studies.html\">SFU Continuing Studies</a><br />\n\t<a href=\"mailto:learn@sfu.ca\">learn@sfu.ca</a><br />\n</p>\n\n";
      }

      output.value = bodyHtml.trim();
    }
  </script>
</body>
</html>
