<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Campaigner Email Body Converter</title>

  <!-- Custom Favicon Links -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      max-width: 860px;
      margin: 0 auto;
      color: #1e293b;
      background: #f8fafc;
    }
    h2 { 
      margin-top: 0; 
      color: #0f172a; 
      font-size: 20px;
    }
    
    /* Upload Drop Zone */
    .drop-zone {
      border: 2px dashed #94a3b8;
      border-radius: 8px;
      padding: 32px 20px;
      text-align: center;
      background: #f1f5f9;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .drop-zone:hover { 
      border-color: #CC0633; 
      background: #fef2f2;
    }
    .drop-zone svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: #64748b;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s;
    }
    .drop-zone:hover svg { stroke: #CC0633; }
    .drop-zone-text {
      margin: 0;
      font-size: 14px;
      color: #334155;
    }
    .drop-zone-subtext {
      margin: 0;
      font-size: 12px;
      color: #64748b;
    }

    /* Controls & Global Action Bar */
    .controls {
      margin-top: 16px;
      display: flex;
      gap: 10px;
    }

    /* Buttons */
    button {
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.15s;
    }
    .btn-primary {
      background: #CC0633;
      color: #fff;
      padding: 8px 16px;
    }
    .btn-primary:hover { background: #a6192e; }
    .btn-secondary {
      background: #e2e8f0;
      color: #334155;
      padding: 8px 16px;
    }
    .btn-secondary:hover {
      background: #cbd5e1;
      color: #0f172a;
    }
    .btn-quick-copy {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
      padding: 6px 12px;
      font-size: 12px;
      white-space: nowrap;
    }
    .btn-quick-copy:hover {
      background: #e2e8f0;
      color: #0f172a;
      border-color: #94a3b8;
    }

    /* Metadata Panel (Subject & Preheader) */
    .metadata-panel {
      margin-top: 18px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .meta-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .meta-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
    }
    .meta-input-group {
      display: flex;
      gap: 8px;
    }
    .meta-input {
      flex: 1;
      padding: 7px 10px;
      font-size: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      background: #f8fafc;
      color: #0f172a;
      outline: none;
    }
    .meta-input:focus {
      border-color: #CC0633;
      background: #ffffff;
    }

    /* Output Area */
    .output-wrapper {
      margin-top: 18px;
    }
    .output-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .output-header {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
    }
    textarea {
      width: 100%;
      height: 400px;
      font-family: Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
      line-height: 1.45;
      background: #ffffff;
      color: #0f172a;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.03);
    }
    textarea:focus {
      outline: 2px solid #CC0633;
      outline-offset: -1px;
      border-color: transparent;
    }
  </style>
</head>
<body>
  <h2>Campaigner Email Body Converter</h2>

  <div class="drop-zone" id="drop-zone">
    <svg viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
      <polyline points="17 8 12 3 7 8" />
      <line x1="12" y1="3" x2="12" y2="15" />
    </svg>
    <p class="drop-zone-text">Drag and drop your <strong>.docx</strong> file here, or click to browse</p>
    <p class="drop-zone-subtext">Automatically extracts subject line, preheader, and builds Campaigner HTML</p>
    <input type="file" id="file-input" accept=".docx" style="display: none;" />
  </div>

  <div class="controls">
    <button class="btn-secondary" id="reset-btn">Reset All</button>
  </div>

  <!-- Metadata Extraction Panel -->
  <div class="metadata-panel">
    <div class="meta-row">
      <label class="meta-label" for="subject-field">Subject Line</label>
      <div class="meta-input-group">
        <input type="text" id="subject-field" class="meta-input" placeholder="Extracted subject line will appear here..." />
        <button class="btn-quick-copy" id="copy-subject-btn">Copy</button>
      </div>
    </div>
    <div class="meta-row">
      <label class="meta-label" for="preheader-field">Preheader</label>
      <div class="meta-input-group">
        <input type="text" id="preheader-field" class="meta-input" placeholder="Extracted preheader will appear here..." />
        <button class="btn-quick-copy" id="copy-preheader-btn">Copy</button>
      </div>
    </div>
  </div>

  <!-- Main HTML Output Area -->
  <div class="output-wrapper">
    <div class="output-bar">
      <span class="output-header">Target &lt;td&gt; HTML Output</span>
      <button class="btn-primary" id="copy-output-btn">Copy HTML to Clipboard</button>
    </div>
    <textarea id="output" placeholder="Target <td> content will render here..."></textarea>
  </div>

  <script>
    const fileInput = document.getElementById("file-input");
    const dropZone = document.getElementById("drop-zone");
    const output = document.getElementById("output");
    const subjectField = document.getElementById("subject-field");
    const preheaderField = document.getElementById("preheader-field");

    const resetBtn = document.getElementById("reset-btn");
    const copyOutputBtn = document.getElementById("copy-output-btn");
    const copySubjectBtn = document.getElementById("copy-subject-btn");
    const copyPreheaderBtn = document.getElementById("copy-preheader-btn");

    dropZone.addEventListener("click", () => fileInput.click());
    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropZone.style.borderColor = "#CC0633";
      dropZone.style.background = "#fef2f2";
    });
    dropZone.addEventListener("dragleave", () => {
      dropZone.style.borderColor = "";
      dropZone.style.background = "";
    });
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.style.borderColor = "";
      dropZone.style.background = "";
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener("change", (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    // Reset handler
    resetBtn.addEventListener("click", () => {
      output.value = "";
      subjectField.value = "";
      preheaderField.value = "";
      fileInput.value = "";
    });

    // Copy helper with feedback
    function triggerCopy(element, button, originalText) {
      if (!element.value) return;
      element.select();
      navigator.clipboard.writeText(element.value);
      button.textContent = "Copied!";
      setTimeout(() => button.textContent = originalText, 1400);
    }

    copyOutputBtn.addEventListener("click", () => triggerCopy(output, copyOutputBtn, "Copy HTML to Clipboard"));
    copySubjectBtn.addEventListener("click", () => triggerCopy(subjectField, copySubjectBtn, "Copy"));
    copyPreheaderBtn.addEventListener("click", () => triggerCopy(preheaderField, copyPreheaderBtn, "Copy"));

    function handleFile(file) {
      if (!file.name.endsWith(".docx")) {
        alert("Please upload a .docx file.");
        return;
      }
      const reader = new FileReader();
      reader.onload = function(event) {
        const options = {
          styleMap: [
            "r[color='c00000'] => h2",
            "r[color='cc0633'] => h2",
            "r[color='a6192e'] => h2",
            "r[color='ff0000'] => h2",
            "r[color='red'] => h2"
          ]
        };
        mammoth.convertToHtml({ arrayBuffer: event.target.result }, options)
          .then(buildCampaignerBody)
          .catch(err => alert("Parsing error: " + err.message));
      };
      reader.readAsArrayBuffer(file);
    }

    function buildCampaignerBody(result) {
      let rawHtml = result.value;

      rawHtml = rawHtml
        .replace(/&nbsp;/g, " ")
        .replace(/\u00A0/g, " ")
        .replace(/<a[^>]*id="_Int_[^>]*><\/a>/gi, "")
        .replace(/<a[^>]*href="#footnote[^>]*>.*?<\/a>/gi, "")
        .replace(/<a[^>]*id="footnote-ref[^>]*><\/a>/gi, "");

      const parser = new DOMParser();
      const doc = parser.parseFromString(rawHtml, "text/html");

      doc.querySelectorAll("ul").forEach(ul => {
        const listItems = Array.from(ul.querySelectorAll("li"));
        listItems.forEach(li => {
          const p = doc.createElement("p");
          p.innerHTML = li.innerHTML;
          ul.parentNode.insertBefore(p, ul);
        });
        ul.remove();
      });

      const rawElements = Array.from(doc.body.children);
      const cleanNodes = [];
      const footnoteNodes = [];
      let customGreeting = "";
      let customSignature = [];

      let extractedSubject = "";
      let extractedPreheader = "";

      const isDateOrTime = (str) => {
        return /^(monday|tuesday|wednesday|thursday|friday|saturday|sunday|jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec|\d{1,2}:\d{2})\b/i.test(str.trim().toLowerCase());
      };

      // 1. Separate metadata (Subject/Preheader), footnotes, and content
      for (let i = 0; i < rawElements.length; i++) {
        const el = rawElements[i];
        let text = el.textContent.replace(/\s+/g, " ").trim();
        if (!text) continue;

        // Extract Subject Line
        if (/^subject(\s*line)?:\s*/i.test(text)) {
          extractedSubject = text.replace(/^subject(\s*line)?:\s*/i, "").trim();
          continue;
        }

        // Extract Preheader
        if (/^preheader:\s*/i.test(text)) {
          extractedPreheader = text.replace(/^preheader:\s*/i, "").trim();
          continue;
        }

        // Skip internal tracking tags
        if (/^campaigner-[a-z0-9-]+$/i.test(text) || /^promote\s+[a-z0-9\s]+/i.test(text)) {
          continue;
        }

        // Sign-off capture
        if (/^(warm|kind|best)\s+(regards|wishes),?\s*$/i.test(text)) {
          customGreeting = text.replace(/,?\s*$/, ",");
          continue;
        }

        if (customGreeting && (text.includes("@sfu.ca") || text.toLowerCase().includes("studio") || text.toLowerCase().includes("continuing studies"))) {
          customSignature.push(el.innerHTML.replace(/\s+/g, " ").trim());
          continue;
        }

        // Footnotes
        if (/^(\[\d+\]|p\.\s*\d+)/i.test(text) || el.id?.includes("footnote") || el.querySelector("li[id^='footnote']")) {
          footnoteNodes.push(el);
          continue;
        }

        cleanNodes.push(el);
      }

      // Populate metadata UI fields
      subjectField.value = extractedSubject;
      preheaderField.value = extractedPreheader;

      // 2. Merge sub-detail rows
      const mergedNodes = [];
      for (let i = 0; i < cleanNodes.length; i++) {
        const el = cleanNodes[i];
        const text = el.textContent.replace(/\s+/g, " ").trim();

        const isSubDetail = 
          /^(starts|begins)\s+/i.test(text) ||
          /^instructors?:/i.test(text) ||
          /^topic:\s*/i.test(text) ||
          /^\d{1,2}(:\d{2})?\s*(a\.m\.|p\.m\.|am|pm)/i.test(text) ||
          /^find us on/i.test(text);

        if (isSubDetail && mergedNodes.length > 0) {
          const prev = mergedNodes[mergedNodes.length - 1];
          prev.innerHTML = prev.innerHTML.trim() + "<br />\n" + el.innerHTML.trim();
        } else {
          mergedNodes.push(el);
        }
      }

      // 3. Assemble target Campaigner body
      let bodyHtml = `<p>Hi [Contact.First Name],</p>\n\n`;

      mergedNodes.forEach(el => {
        let text = el.textContent.replace(/\s+/g, " ").trim();
        let inner = el.innerHTML.replace(/\s+/g, " ").trim();

        if (/^(hi|hello|dear)\s+[^,]+,?\s*$/i.test(text)) return;

        inner = inner.replace(/(<br\s*\/?>\s*)+$/gi, "").trim();
        if (!inner) return;

        // Button handler
        if (/\[button\]/i.test(text)) {
          const anchor = el.querySelector("a");
          const href = anchor ? anchor.getAttribute("href") : "https://www.sfu.ca/continuing-studies.html";
          let label = anchor ? anchor.textContent.replace(/\[button\]/i, "").trim() : text.replace(/\[button\]/i, "").trim();
          if (!label) label = "View details";

          let precedingContent = inner
            .replace(new RegExp(`<a[^>]*href=["']?${href.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}["']?[^>]*>.*?<\\/a>`, "gi"), "")
            .replace(/<a[^>]*>.*?\[button\].*?<\/a>/gi, "")
            .replace(/\[button\]/gi, "")
            .replace(/(<br\s*\/?>\s*)+$/gi, "")
            .trim();

          if (precedingContent) {
            bodyHtml += `<p>${precedingContent}</p>\n\n`;
          }

          bodyHtml += `<p class="btn"><a class="btn" href="${href}">${label}</a></p>\n\n`;
          return;
        }

        // Section headings
        const isHeaderTag = /^h[1-3]$/i.test(el.tagName);
        const isMajorSection = /^(more\s+[a-z0-9\s]+(courses|workshops)|upcoming\s+[a-z0-9\s]+)/i.test(text);

        if ((isHeaderTag || isMajorSection) && !isDateOrTime(text) && !text.includes("Topic:")) {
          const cleanHeading = el.textContent.replace(/\s+/g, " ").trim();
          bodyHtml += `<h2>${cleanHeading}</h2>\n\n`;
          return;
        }

        // Event & Course cards
        if (text.includes("Starts ") || text.includes("Begins ") || text.includes("Instructors:") || isDateOrTime(text) || text.includes("Topic:")) {
          const tempDiv = document.createElement("div");
          tempDiv.innerHTML = inner;

          if ((isDateOrTime(text) || !tempDiv.querySelector("strong")) && !tempDiv.innerHTML.startsWith("<strong>")) {
            tempDiv.innerHTML = tempDiv.innerHTML.replace(/^([^<]+?)(<br\s*\/?>|$)/i, "<strong>$1</strong>$2");
          }

          Array.from(tempDiv.querySelectorAll("a")).forEach(a => {
            const href = a.getAttribute("href") || "";
            if (href.includes("/instructors/") || a.parentElement?.textContent?.includes("Instructor")) {
              if (!a.querySelector("strong") && !a.closest("strong")) {
                a.innerHTML = `<strong>${a.innerHTML}</strong>`;
              }
            }
          });

          bodyHtml += `<p>${tempDiv.innerHTML.trim()}</p>\n\n`;
          return;
        }

        bodyHtml += `<p>${inner}</p>\n\n`;
      });

      // Sign-off
      if (customGreeting) {
        bodyHtml += `<p>${customGreeting}</p>\n\n`;
        bodyHtml += `<p>\n\t${customSignature.join("<br />\n\t")}<br />\n</p>\n\n`;
      } else {
        bodyHtml += `<p>Kind regards,</p>\n\n`;
        bodyHtml += `<p>\n\t<a href="https://www.sfu.ca/continuing-studies.html">SFU Continuing Studies</a><br />\n\t<a href="mailto:learn@sfu.ca">learn@sfu.ca</a><br />\n</p>\n\n`;
      }

      // Footnotes
      if (footnoteNodes.length > 0) {
        footnoteNodes.forEach(fn => {
          let cleanText = fn.innerHTML
            .replace(/<a[^>]*>↑<\/a>/gi, "")
            .replace(/<\/?(li|p)[^>]*>/gi, "")
            .replace(/\s+/g, " ")
            .trim();

          if (!cleanText.includes("<a ")) {
            cleanText = cleanText.replace(/(https?:\/\/[^\s"'>]+)/gi, '<a href="$1">$1</a>');
            cleanText = cleanText.replace(/(?<!https?:\/\/)(www\.[^\s"'>]+)/gi, '<a href="https://$1">$1</a>');
          } else {
            cleanText = cleanText.replace(/href="www\./gi, 'href="https://www.');
          }

          bodyHtml += `<p style="font-size:0.8em;line-height:1.4;color:#666666;">${cleanText}</p>\n`;
        });
      }

      output.value = bodyHtml.trim();
    }
  </script>
</body>
</html>
